{% extends "dashboard/base_dashboard.html" %}

{% block content %}
<style>
    .form-wrapper {
        max-width: 550px;
        margin: 40px auto;
        padding: 25px 35px;
        background: #ffffff;
        border-radius: 15px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        border: 1px solid #eaeaea;
    }

    .form-wrapper h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #4e4e4e;
        font-weight: 700;
    }

    label {
        font-weight: 600;
        display: block;
        margin-bottom: 5px;
        color: #555;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #d0d0d0;
        margin-bottom: 15px;
        font-size: 15px;
        transition: 0.2s;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #9b6cf3;
        box-shadow: 0 0 4px rgba(155, 108, 243, 0.5);
        outline: none;
    }

    .btn-submit {
        display: block;
        width: 100%;
        padding: 12px;
        background: linear-gradient(90deg, #9b6cf3, #7bc6ff);
        border: none;
        color: white;
        font-size: 16px;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-submit:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }

</style>

<div class="form-wrapper">
    <h2>{% block titulo_form %}{% endblock %}</h2>

    <form method="POST">
        {% csrf_token %}
        {% block campos_formulario %}{% endblock %}

        <button class="btn-submit">Guardar</button>
    </form>
</div>

{% endblock %}
