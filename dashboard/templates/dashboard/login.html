{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduSmart</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
            font-size: 48px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
            color: #1e293b;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 35px;
            font-size: 15px;
        }

        label {
            font-weight: 600;
            color: #1e293b;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            font-size: 15px;
            background: #f8fafc;
            transition: all 0.3s ease;
            font-family: inherit;
            color: #1e293b;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
            }
            
            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">✨</div>
        <h1>EduSmart</h1>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>

        <form method="POST">
            {% csrf_token %}
            
            <label>📧 Email</label>
            <input type="email" name="email" placeholder="tu@email.com" required autocomplete="email">

            <label>🔒 Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">

            <button type="submit">🔐 Ingresar</button>
        </form>

        <p class="footer-text">© 2025 EduSmart. Todos los derechos reservados.</p>
    </div>

</body>
</html>
